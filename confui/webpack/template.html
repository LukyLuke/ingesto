<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ingesto ConfUI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div class="min-h-screen flex flex-col">

      <!-- Header -->
      <header class="bg-slate-900 text-white border-b border-slate-800">
        <div class="max-w-6xl mx-auto px-4 py-3">
          <div class="flex items-center justify-between gap-4">
            <!-- logo -->
            <div class="flex items-center gap-3">
              <img src="../../doc/logo.png" alt="ingesto" class="w-28 h-auto object-contain" />
            </div>

            <!-- menu -->
            <nav id="main-navigation" class="hidden md:flex items-center gap-1">
              <button type="button"
                class="px-3 py-2 rounded-md text-sm text-slate-100 hover:bg-slate-800/70 hover:text-white transition"
                data-action="loadConfig">Load Config</button>
              </nav>
          </div>
        </div>
      </header>

      <!-- Main content -->
      <main class="flex-1">
        <div class="max-w-6xl mx-auto px-4 py-6">
          <div class="grid grid-cols-12 gap-4 items-start">
            <!-- Left: Content pane -->
            <section class="col-span-7 bg-white rounded-xl border border-slate-200 shadow-sm">
              <div class="px-4 py-4 border-b border-slate-200">
                <div class="flex items-center justify-between gap-3">
                  <div>
                    <h2 class="text-base font-semibold text-slate-900">
                      Configuration
                    </h2>
                    <p class="text-sm text-slate-600">
                      Expand sections, edit fields, and select an element for documentation.
                    </p>
                  </div>
                </div>
              </div>

              <div class="p-4 space-y-3">
                <!-- Accordion Section 1 -->
                <div class="rounded-lg border border-slate-200 overflow-hidden">
                  <button
                    type="button"
                    class="w-full text-left px-4 py-3 flex items-center justify-between gap-3 hover:bg-slate-50 transition"
                    data-toggle="section-params"
                    aria-expanded="true"
                  >
                    <div class="flex items-center gap-3">
                      <span class="inline-flex items-center justify-center h-9 w-9 px-1 py-1 rounded-md bg-teal-50 border border-teal-200">
                        <img src="../../doc/favicon.png" alt="section" />
                      </span>
                      <div>
                        <div class="font-medium text-slate-900">Queue</div>
                        <div class="text-xs text-slate-600">Blubber blah</div>
                      </div>
                    </div>

                    <span class="text-slate-500">
                      <svg class="h-5 w-5 transition-transform" data-chevron class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 18l6-6-6-6"/>
                      </svg>
                    </span>
                  </button>

                  <div id="section-params" class="px-4 pb-4">
                    <!-- Sub-container A -->
                    <div class="mt-2 rounded-lg border border-slate-200 bg-slate-50 p-3">
                      <div class="flex items-center justify-between gap-3 mb-3">
                        <div>
                          <div class="text-sm font-semibold text-slate-900">Runtime</div>
                          <div class="text-xs text-slate-600">Core behavior settings</div>
                        </div>
                        <button
                          type="button"
                          class="px-2.5 py-1.5 text-xs rounded-md bg-white border border-slate-200 hover:bg-slate-100 transition"
                          data-select="runtime"
                        >
                          Docs
                        </button>
                      </div>

                      <div class="grid grid-cols-2 gap-3">
                        <div>
                          <label class="text-xs font-medium text-slate-700">Mode</label>
                          <select
                            class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-teal-500"
                            data-select="runtime.mode"
                          >
                            <option value="dev">Development</option>
                            <option value="prod">Production</option>
                          </select>
                        </div>

                        <div>
                          <label class="text-xs font-medium text-slate-700">Max Iterations</label>
                          <input
                            type="number"
                            min="1"
                            class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-teal-500"
                            placeholder="e.g. 100"
                            data-select="runtime.max_iterations"
                          />
                        </div>

                        <div class="col-span-2">
                          <label class="text-xs font-medium text-slate-700">Seed (optional)</label>
                          <input
                            type="text"
                            class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-teal-500"
                            placeholder="e.g. 42"
                            data-select="runtime.seed"
                          />
                        </div>
                      </div>
                    </div>

                    <!-- Sub-container B -->
                    <div class="mt-3 rounded-lg border border-slate-200 bg-white p-3">
                      <div class="flex items-center justify-between gap-3 mb-3">
                        <div>
                          <div class="text-sm font-semibold text-slate-900">Networking</div>
                          <div class="text-xs text-slate-600">Endpoints used by the WASM module</div>
                        </div>
                        <button
                          type="button"
                          class="px-2.5 py-1.5 text-xs rounded-md bg-white border border-slate-200 hover:bg-slate-100 transition"
                          data-select="networking"
                        >
                          Docs
                        </button>
                      </div>

                      <div class="grid grid-cols-2 gap-3">
                        <div class="col-span-2">
                          <label class="text-xs font-medium text-slate-700">API Base URL</label>
                          <input
                            type="text"
                            class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-teal-500"
                            placeholder="https://example.com/api"
                            data-select="networking.base_url"
                          />
                        </div>

                        <div>
                          <label class="text-xs font-medium text-slate-700">Timeout (ms)</label>
                          <input
                            type="number"
                            class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-teal-500"
                            placeholder="5000"
                            data-select="networking.timeout_ms"
                          />
                        </div>

                        <div>
                          <label class="text-xs font-medium text-slate-700">Retry Count</label>
                          <input
                            type="number"
                            class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-teal-500"
                            placeholder="3"
                            data-select="networking.retry_count"
                          />
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- Accordion Section 2 -->

              </div>
            </section>

            <!-- Right: Documentation pane -->
            <aside class="col-span-5">
              <div class="bg-slate-900 text-white rounded-xl border border-slate-800 shadow-sm overflow-hidden">
                <div class="px-4 py-4 border-b border-slate-800">
                  <div class="flex items-center justify-between gap-3">
                    <h2 class="text-base font-semibold">Documentation</h2>
                  </div>

                  <div class="mt-3">
                    <div class="text-xs text-slate-400">Selection</div>
                    <div id="docTitle" class="text-sm font-semibold text-teal-200 mt-1">
                      runtime
                    </div>
                  </div>
                </div>

                <div class="p-4 space-y-4">
                  <div class="rounded-lg bg-white/5 border border-slate-800 p-3">
                    <div class="text-sm font-semibold text-teal-200">What is it for</div>
                    <p id="docDescription" class="text-sm text-slate-200 mt-1">
                      <!-- Documentation -->
                    </p>
                  </div>

                  <div class="rounded-lg bg-white/5 border border-slate-800 p-3">
                    <div class="text-sm font-semibold text-teal-200">Values / Types</div>
                    <ul id="docInputs" class="text-sm text-slate-200 mt-2 space-y-2">
                      <!--li class="flex items-start gap-2">
                        <span class="text-teal-200">•</span>
                        <span><span class="font-semibold">Mode</span> — dev/prod runtime selection.</span>
                      </li-->
                    </ul>
                  </div>

                  <div class="rounded-lg bg-white/5 border border-slate-800 p-3">
                    <div class="text-sm font-semibold text-teal-200">Actions</div>
                    <div class="mt-2 flex gap-2">
                      <button type="button" data-action="docsApply"
                        class="flex-1 px-3 py-2 rounded-md bg-teal-600 hover:bg-teal-700 transition text-sm">
                        Create and Save Configuration
                      </button>
                    </div>
                  </div>

                </div>
              </div>
            </aside>
          </div>
        </div>
      </main>

      <!-- Footer -->
      <footer class="bg-slate-900 text-slate-300 border-t border-slate-800">
        <div class="max-w-6xl mx-auto px-4 py-4">
          <div class="text-sm">
            © 2026 Lukas LukyLuke_ch Zurschmiede. All rights reserved.
          </div>
        </div>
      </footer>
    </div>

    <script>
      const docTitle = document.getElementById("docTitle");
      const docDescription = document.getElementById("docDescription");
      const docInputs = document.getElementById("docInputs");

      function wasmCall(action, payload) {
        // Hook this into wasm-bindgen exports, e.g.:
        // window.wasm_app?.[action]?.(payload)
        console.log("WASM call:", action, payload);
      }

      // Accordion behavior
      document.querySelectorAll("[data-toggle]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-toggle");
          const panel = document.getElementById(id);
          const expanded = btn.getAttribute("aria-expanded") === "true";

          btn.setAttribute("aria-expanded", String(!expanded));
          if (expanded) panel.classList.add("hidden");
          else panel.classList.remove("hidden");

          const chevron = btn.querySelector("[data-chevron]");
          if (chevron) chevron.style.transform = expanded ? "rotate(0deg)" : "rotate(180deg)";
        });
      });

      function setDocFor(selectionKey) {
        docTitle.textContent = selectionKey;

        const docs = {
          runtime: {
            description:
              "Controls the runtime behavior of the WASM module, including execution mode, iteration limits, and deterministic seeding.",
            inputs: [
              "Mode — dev/prod runtime selection.",
              "Max Iterations — upper bound for repeated work.",
              "Seed — optional deterministic seed."
            ]
          },
          "runtime.mode": {
            description:
              "Switches how the WASM module behaves: faster diagnostics for development, stricter behavior for production.",
            inputs: ["dev — optimized for iteration.", "prod — optimized for stable output."]
          },
          "runtime.max_iterations": {
            description:
              "Limits the maximum number of iterations or retry loops used by the WASM logic to prevent runaway computations.",
            inputs: ["Higher values may increase accuracy but cost CPU time."]
          },
          networking: {
            description:
              "Defines networking parameters used by the WASM module when calling your backend services.",
            inputs: ["API Base URL — base endpoint for requests.", "Timeout (ms) — request time limit.", "Retry Count — retry attempts on failure."]
          },
          "networking.base_url": {
            description:
              "The base URL used for API requests. Keep this aligned with your backend routing.",
            inputs: ["Example: https://example.com/api"]
          },
          appearance: {
            description:
              "Controls visual behavior and animation preferences for the UI layer.",
            inputs: ["Accent Color — UI accent value.", "Transition (ms) — animation timing.", "Reduce Motion — accessibility-friendly behavior."]
          }
        };

        const chosen = docs[selectionKey] || {
          description:
            "Documentation for this element will appear here. Wire this selection key to your wasm-bindgen data model.",
          inputs: ["No inputs listed yet."]
        };

        docDescription.textContent = chosen.description;
        docInputs.innerHTML = chosen.inputs
          .map(
            item =>
              `<li class="flex items-start gap-2">
                <span class="text-teal-200">•</span>
                <span>${item}</span>
              </li>`
          )
          .join("");
      }

      // Selection wiring for inputs/buttons
      document.querySelectorAll("[data-select]").forEach(el => {
        const key = el.getAttribute("data-select");
        el.addEventListener("click", (e) => {
          // avoid accordion clicks if they overlap
          e.stopPropagation();
          setDocFor(key);
          wasmCall("selectElement", { key });
        });
        el.addEventListener("focus", () => {
          setDocFor(key);
        });
      });

    </script>
  </body>
</html>
